<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갱신 결정 - 보증금 타임키퍼</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Noto Sans KR", sans-serif;
    background: #f5f5f4;
    color: #2a2724;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border: 1px solid #e5e2da;
    border-radius: 12px;
    padding: 32px;
  }

  /* 상단 뒤로가기 */
  .back-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .back-btn {
    width: 34px; height: 34px;
    background: #fff; border: 1px solid #d5cdbb; border-radius: 8px;
    cursor: pointer; font-size: 16px; color: #6b6558;
  }
  .back-row span { font-size: 13px; color: #999; }

  /* 질문 영역 (화면 중앙) */
  .question { text-align: center; padding: 24px 0 28px; }
  .question .icon-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; border-radius: 50%;
    background: #fbf3e2; margin-bottom: 16px; font-size: 28px;
  }
  .question .q-title { font-size: 20px; font-weight: 700; }
  .question .q-desc { font-size: 14px; color: #6b6558; margin-top: 8px; line-height: 1.6; }

  /* 두 선택지 카드 */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .choice {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 28px 16px;
    background: #fff; border: 1px solid #d5cdbb; border-radius: 12px;
    cursor: pointer; font-family: inherit;
  }
  .choice:hover { border-color: #35586b; background: #f7f9fa; }
  .choice .choice-icon { font-size: 32px; }
  .choice .choice-title { font-size: 16px; font-weight: 700; color: #2a2724; }
  .choice .choice-sub { font-size: 12px; color: #6b6558; text-align: center; line-height: 1.5; }

  /* 하단 안심 안내 */
  .hint {
    display: flex; align-items: flex-start; gap: 8px;
    margin-top: 20px; padding: 12px;
    background: #f5f3ee; border-radius: 8px;
    font-size: 12px; color: #6b6558; line-height: 1.6;
  }

  @media (max-width: 480px) {
    .card { padding: 24px; }
    .choices { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="back-row">
      <button class="back-btn" onclick="goBack()" aria-label="뒤로">&#8592;</button>
      <span>타임라인으로 돌아가기</span>
    </div>

    <div class="question">
      <div class="icon-circle">&#128197;</div>
      <div class="q-title">계약 만료가 6개월 남았어요</div>
      <div class="q-desc">
        이 집에서 계속 사실 건가요, 아니면 나가실 건가요?<br>
        선택하면 다음에 뭘 해야 하는지 알려드려요.
      </div>
    </div>

    <div class="choices">
      <!-- 갱신 선택 -> 3-A 결과 화면으로 -->
      <button class="choice" onclick="choose('renew')">
        <span class="choice-icon">&#127968;</span>
        <span class="choice-title">갱신할래요</span>
        <span class="choice-sub">계속 살고 싶어요</span>
      </button>

      <!-- 퇴거 선택 -> 3-B 결과 화면으로 -->
      <button class="choice" onclick="choose('leave')">
        <span class="choice-icon">&#128682;</span>
        <span class="choice-title">나갈래요</span>
        <span class="choice-sub">이사 나갈 거예요</span>
      </button>
    </div>

    <div class="hint">
      <span>아직 안 정하셨어도 괜찮아요. 통보 마지노선(만료 2개월 전)까지는 여유가 있어요.</span>
    </div>
  </div>

<script>
  function goBack() { alert('타임라인 화면으로 돌아가기'); }

  // 선택에 따라 결과 화면으로 분기
  function choose(type) {
    if (type === 'renew') {
      alert('갱신 결과 화면(3-A)으로 이동');
      // 실제로는 갱신 안내 화면으로 이동
    } else {
      alert('퇴거 결과 화면(3-B)으로 이동');
      // 실제로는 퇴거 안내 화면으로 이동
    }
  }
</script>
</body>
</html>
